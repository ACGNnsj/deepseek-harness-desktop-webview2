name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或标签，留空则用触发提交
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # WiX 只接受纯数字版本，NSIS 仍用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./apps/desktop/src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*$/, '');
            fs.writeFileSync('apps/desktop/release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build installers
        run: pnpm tauri build --config release-msi-version.tmp.json

      - name: Normalize release asset names
        run: node scripts/rename-release-assets.mjs apps/desktop/src-tauri/target/release/bundle/nsis apps/desktop/src-tauri/target/release/bundle/msi

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
